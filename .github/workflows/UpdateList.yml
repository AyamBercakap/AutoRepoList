name: Sync Master Repos JSON

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 
  push:
    paths:
      - 'updater.js'

permissions:
  contents: write # Gives the action permission to commit repos.json back to your repo

jobs:
  sync-repos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repolist repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Master Updater Script
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node updater.js

      - name: Commit and push updated repoList.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repoList.json
          git diff --staged --quiet || (git commit -m "chore: update repoList.json" && git push)